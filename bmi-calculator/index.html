<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <title>BMI Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>BMI Calculator</h1>

    <label for="weight">Pesha (kg):</label>
    <input type="number" id="weight" placeholder="p.sh. 70">

    <label for="height">Gjatësia (cm):</label>
    <input type="number" id="height" placeholder="p.sh. 175">

    <button onclick="calculateBMI()">Llogarit</button>

    <p id="result"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
